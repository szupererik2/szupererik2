<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- EDIT: change the texts in the <text> tags below to customise the banner -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#151a3a"/>
      <stop offset="100%" stop-color="#2a1245"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#b388ff;#ff4081;#00e5ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff4081">
        <animate attributeName="stop-color" values="#ff4081;#00e5ff;#b388ff;#ff4081" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .code { font-family: 'Courier New', monospace; fill: #7c8cff; opacity: .35; font-size: 22px; }
    .f1 { animation: float 6s ease-in-out infinite; }
    .f2 { animation: float 8s ease-in-out infinite reverse; }
    .f3 { animation: float 7s ease-in-out infinite 1s; }
    .f4 { animation: float 9s ease-in-out infinite reverse .5s; }
    .f5 { animation: float 5s ease-in-out infinite 2s; }
    .f6 { animation: float 10s ease-in-out infinite reverse 1.5s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    .name { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 72px; font-weight: 800; fill: url(#title); }
    .sub  { font-family: 'Courier New', monospace; font-size: 24px; fill: #cfd8ff; }
    .cursor { animation: blink 1s steps(2, start) infinite; fill: #00e5ff; }
    @keyframes blink { to { visibility: hidden; } }
    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateY(-20px); } to { transform: translateY(280px); } }
  </style>

  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="18" fill="url(#grid)"/>

  <!-- scanline -->
  <rect class="scan" width="1000" height="3" fill="#00e5ff" opacity="0.08"/>

  <!-- floating code symbols -->
  <text class="code f1" x="60"  y="70">{ }</text>
  <text class="code f2" x="170" y="215">&lt;/&gt;</text>
  <text class="code f3" x="860" y="80">0101</text>
  <text class="code f4" x="780" y="225">mqtt://</text>
  <text class="code f5" x="920" y="160">;</text>
  <text class="code f6" x="40"  y="150">♞</text>

  <!-- title -->
  <text class="name" x="500" y="135" text-anchor="middle" filter="url(#glow)">Erik Szegedi</text>
  <text class="sub" x="500" y="185" text-anchor="middle">Software Engineer · Industrial IoT &amp; Automation<tspan class="cursor"> ▌</tspan></text>

  <!-- accent line -->
  <rect x="380" y="205" width="240" height="3" rx="1.5" fill="url(#title)"/>
</svg>
