<svg width="800" height="382" viewBox="0 0 800 382" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- EDIT: change the text inside each <text> line. Lines appear one after another and loop. -->
  <style>
    .t   { font-family: 'Courier New', monospace; font-size: 19px; opacity: 0; }
    .cmd { fill: #7ee787; }
    .out { fill: #e6edf3; }
    .acc { fill: #00e5ff; }
    .l1{animation:s1 18s infinite}
    @keyframes s1{0%,1.0%{opacity:0} 3.0%,90%{opacity:1} 96%,100%{opacity:0}}
    .l2{animation:s2 18s infinite}
    @keyframes s2{0%,9.7%{opacity:0} 11.7%,90%{opacity:1} 96%,100%{opacity:0}}
    .l3{animation:s3 18s infinite}
    @keyframes s3{0%,18.3%{opacity:0} 20.3%,90%{opacity:1} 96%,100%{opacity:0}}
    .l4{animation:s4 18s infinite}
    @keyframes s4{0%,27.0%{opacity:0} 29.0%,90%{opacity:1} 96%,100%{opacity:0}}
    .l5{animation:s5 18s infinite}
    @keyframes s5{0%,35.7%{opacity:0} 37.7%,90%{opacity:1} 96%,100%{opacity:0}}
    .l6{animation:s6 18s infinite}
    @keyframes s6{0%,44.3%{opacity:0} 46.3%,90%{opacity:1} 96%,100%{opacity:0}}
    .l7{animation:s7 18s infinite}
    @keyframes s7{0%,53.0%{opacity:0} 55.0%,90%{opacity:1} 96%,100%{opacity:0}}
    .l8{animation:s8 18s infinite}
    @keyframes s8{0%,61.7%{opacity:0} 63.7%,90%{opacity:1} 96%,100%{opacity:0}}
    .l9{animation:s9 18s infinite}
    @keyframes s9{0%,70.3%{opacity:0} 72.3%,90%{opacity:1} 96%,100%{opacity:0}}
    .cur { animation: blink 1s steps(2,start) infinite; fill: #7ee787; }
    @keyframes blink { to { visibility: hidden; } }
  </style>
  <rect width="800" height="382" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect width="800" height="38" rx="12" fill="#161b22"/>
  <rect y="26" width="800" height="12" fill="#161b22"/>
  <circle cx="24" cy="19" r="7" fill="#ff5f56"/>
  <circle cx="48" cy="19" r="7" fill="#ffbd2e"/>
  <circle cx="72" cy="19" r="7" fill="#27c93f"/>
  <text x="400" y="24" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#8b949e">erik@cluj: ~</text>
  <text class="t cmd l1" x="24" y="76">$ whoami</text>
  <text class="t out l2" x="24" y="102">erik — software engineer · industrial IoT &amp; automation</text>
  <text class="t cmd l3" x="24" y="142">$ mosquitto_sub -t "factory/#"</text>
  <text class="t out l4" x="24" y="168">factory/line1/temp    <tspan class="acc">72.4</tspan> °C</text>
  <text class="t out l5" x="24" y="194">factory/bin/42        <tspan class="acc">picked ✔</tspan></text>
  <text class="t cmd l6" x="24" y="234">$ cat achievements.txt</text>
  <text class="t out l7" x="24" y="260">🏆 3rd place · County Informatics Olympiad 2023</text>
  <text class="t cmd l8" x="24" y="300">$ git commit -m "learned something new"</text>
  <text class="t cmd l9" x="24" y="340">$ <tspan class="cur">▌</tspan></text>
</svg>
