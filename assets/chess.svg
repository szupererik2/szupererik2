<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- EDIT: change the 'path' keyframes (translate values are column*40, row*40) to make the knight hop elsewhere -->
  <style>
    .knight { font-family: 'Segoe UI Symbol','Noto Sans Symbols2','DejaVu Sans',sans-serif; font-size: 32px; fill: #00e5ff;
              animation: hop 10s ease-in-out infinite alternate; }
    @keyframes hop { 0.0%{transform:translate(0px,0px)} 12.5%{transform:translate(80px,40px)} 25.0%{transform:translate(160px,0px)} 37.5%{transform:translate(240px,40px)} 50.0%{transform:translate(280px,120px)} 62.5%{transform:translate(200px,160px)} 75.0%{transform:translate(120px,200px)} 87.5%{transform:translate(40px,240px)} 100.0%{transform:translate(0px,160px)} }
    .trail { stroke-dasharray: 6 8; animation: dash 2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
  </style>
  <defs><filter id="g"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <clipPath id="r"><rect width="320" height="320" rx="14"/></clipPath>
